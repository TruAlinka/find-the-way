<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Branchway Studio — редактор образовательных игр</title>

  <style>
    :root {
      --page-bg: #090e1c;
      --panel: #111a30;
      --panel-dark: #0c1427;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4f6ff;
      --muted: #8490ad;
      --accent: #9bf6b0;
      --danger: #ff8194;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 75% 0%, #23345f, transparent 35%),
        var(--page-bg);
      font-family: Inter, Arial, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      min-height: 78px;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 13, 27, 0.85);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: #101827;
      background: var(--accent);
      font-size: 22px;
      box-shadow: 0 0 24px rgba(155, 246, 176, 0.35);
    }

    .brand strong {
      display: block;
      letter-spacing: 0.08em;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .button {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      font-size: 12px;
      font-weight: 800;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: rgba(155, 246, 176, 0.45);
    }

    .button-primary {
      border-color: transparent;
      color: #101827;
      background: var(--accent);
    }

    .button-danger {
      color: var(--danger);
    }

    .file-label {
      position: relative;
      overflow: hidden;
    }

    .file-label input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .project-bar {
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
    }

    .project-fields {
      flex: 1;
      min-width: 0;
    }

    .project-title {
      width: min(500px, 100%);
      padding: 0;
      border: 0;
      outline: 0;
      color: white;
      background: transparent;
      font-size: 25px;
      font-weight: 900;
    }

    .project-description {
      width: min(700px, 100%);
      margin-top: 7px;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
    }

    .autosave {
      color: var(--muted);
      font-size: 11px;
    }

    .autosave::before {
      content: "";
      width: 7px;
      height: 7px;
      display: inline-block;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .workspace {
      min-height: calc(100vh - 160px);
      display: grid;
      grid-template-columns: 250px minmax(400px, 1fr) 340px;
    }

    .sidebar {
      padding: 22px 15px;
      border-right: 1px solid var(--border);
      background: var(--panel-dark);
    }

    .sidebar-heading {
      margin: 0 6px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-heading h2 {
      margin: 5px 0 0;
      font-size: 19px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.15em;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: white;
      background: rgba(255, 255, 255, 0.06);
      font-size: 18px;
    }

    .scene-list {
      display: grid;
      gap: 6px;
    }

    .scene-card {
      width: 100%;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 12px 10px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: #dfe4f3;
      background: transparent;
      text-align: left;
    }

    .scene-card:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .scene-card.active {
      border-color: rgba(155, 246, 176, 0.35);
      background: rgba(155, 246, 176, 0.08);
    }

    .scene-number {
      color: var(--accent);
      font-size: 10px;
      font-weight: 900;
    }

    .scene-info {
      min-width: 0;
    }

    .scene-info strong,
    .scene-info small {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .scene-info strong {
      font-size: 11px;
    }

    .scene-info small {
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
    }

    .start-indicator {
      color: var(--accent);
    }

    .editor {
      min-width: 0;
      padding: 28px;
      background: var(--panel);
    }

    .editor-header {
      margin-bottom: 25px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
    }

    .editor-header h1 {
      margin: 7px 0 0;
      font-size: 24px;
    }

    .field {
      margin-bottom: 22px;
    }

    .field label,
    .answer-card label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.13em;
    }

    .input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: 0;
      color: white;
      background: var(--panel-dark);
      font-size: 12px;
    }

    .input:focus {
      border-color: rgba(155, 246, 176, 0.6);
      box-shadow: 0 0 0 3px rgba(155, 246, 176, 0.08);
    }

    textarea.input {
      min-height: 95px;
      resize: vertical;
      line-height: 1.5;
    }

    .media-row,
    .answer-row,
    .design-grid {
      display: grid;
      gap: 8px;
    }

    .media-row {
      grid-template-columns: 120px 1fr;
    }

    .media-preview {
      width: 100%;
      max-height: 210px;
      margin-top: 10px;
      border-radius: 10px;
      object-fit: cover;
      background: #070c18;
    }

    .section-title {
      margin: 32px 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .section-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer-card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-dark);
    }

    .answer-card-header {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .answer-card-header strong {
      color: var(--accent);
      font-size: 11px;
    }

    .delete-answer {
      border: 0;
      color: var(--danger);
      background: transparent;
    }

    .answer-row {
      grid-template-columns: 55px 1fr;
      margin-bottom: 12px;
    }

    .answer-options {
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 8px;
    }

    .design-box {
      margin-top: 32px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.025);
    }

    .design-box h2 {
      margin: 0 0 18px;
      font-size: 17px;
    }

    .design-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .color-field {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 8px;
    }

    .color-field input[type="color"] {
      width: 46px;
      height: 40px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-dark);
    }

    .preview-column {
      padding: 22px;
      border-left: 1px solid var(--border);
      background: var(--panel-dark);
    }

    .preview-column h2 {
      margin: 7px 0 17px;
      font-size: 19px;
    }

    .player {
      position: sticky;
      top: 100px;
      min-height: 510px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 16px;
      background-color: #111a30;
      background-size: cover;
      background-position: center;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
    }

    .player-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-overlay {
      position: absolute;
      inset: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(
          180deg,
          rgba(7, 12, 25, 0.18),
          rgba(7, 12, 25, 0.96) 82%
        );
    }

    .player-top {
      display: flex;
      justify-content: space-between;
      color: #d7dcef;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .player-label {
      color: var(--accent);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .player h3 {
      margin: 9px 0 18px;
      font-size: 26px;
      line-height: 1.08;
    }

    .player-answers {
      display: grid;
      gap: 8px;
    }

    .player-answer {
      width: 100%;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      background: rgba(255, 255, 255, 0.1);
      text-align: left;
    }

    .shape-rounded {
      border-radius: 999px;
    }

    .shape-soft {
      border-radius: 13px;
    }

    .shape-square {
      border-radius: 4px;
    }

    .player-answer:hover {
      color: #101827;
      background: var(--accent);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: 24px;
      display: none;
      place-items: center;
      background: rgba(2, 5, 12, 0.88);
      backdrop-filter: blur(12px);
    }

    .modal.open {
      display: grid;
    }

    .modal-player {
      width: min(850px, 100%);
      min-height: min(720px, calc(100vh - 48px));
    }

    .close-preview {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 55;
    }

    .toast {
      position: fixed;
      top: 90px;
      left: 50%;
      z-index: 100;
      padding: 10px 17px;
      border-radius: 999px;
      color: #101827;
      background: var(--accent);
      font-size: 12px;
      font-weight: 900;
      transform: translateX(-50%);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 230px 1fr;
      }

      .preview-column {
        display: none;
      }
    }

    @media (max-width: 720px) {
      .topbar,
      .project-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .workspace {
        display: block;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .scene-list {
        display: flex;
        overflow-x: auto;
      }

      .scene-card {
        flex: 0 0 190px;
      }

      .editor {
        padding: 20px 15px;
      }

      .editor-header {
        flex-direction: column;
      }

      .design-grid,
      .answer-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">✦</div>

      <div>
        <strong>BRANCHWAY STUDIO</strong>
        <small>Редактор образовательных игр</small>
      </div>
    </div>

    <div class="toolbar">
      <span class="autosave">Сохранено в браузере</span>

      <button class="button" id="resetButton">
        Новый проект
      </button>

      <button class="button" id="exportJsonButton">
        Скачать JSON
      </button>

      <label class="button file-label">
        Загрузить JSON
        <input
          id="importJsonInput"
          type="file"
          accept="application/json"
        >
      </label>

      <button class="button" id="previewButton">
        ▶ Проверить игру
      </button>

      <button class="button button-primary" id="exportGameButton">
        Скачать HTML-игру
      </button>
    </div>
  </header>

  <section class="project-bar">
    <div class="project-fields">
      <input
        class="project-title"
        id="projectTitle"
        aria-label="Название игры"
      >

      <input
        class="project-description"
        id="projectDescription"
        aria-label="Описание игры"
      >
    </div>
  </section>

  <main class="workspace">
    <aside class="sidebar">
      <div class="sidebar-heading">
        <div>
          <span class="eyebrow">СЦЕНАРИЙ</span>
          <h2>Сцены</h2>
        </div>

        <button
          class="icon-button"
          id="addSceneButton"
          title="Добавить сцену"
        >
          ＋
        </button>
      </div>

      <div class="scene-list" id="sceneList"></div>
    </aside>

    <section class="editor">
      <div class="editor-header">
        <div>
          <span class="eyebrow" id="sceneNumber"></span>
          <h1 id="editorSceneTitle">Сцена</h1>
        </div>

        <div class="toolbar">
          <button class="button" id="makeStartButton">
            ☆ Сделать стартовой
          </button>

          <button
            class="button button-danger"
            id="deleteSceneButton"
          >
            Удалить сцену
          </button>
        </div>
      </div>

      <div class="field">
        <label for="sceneTitle">НАЗВАНИЕ СЦЕНЫ</label>
        <input class="input" id="sceneTitle">
      </div>

      <div class="field">
        <label for="sceneTask">ЗАДАНИЕ ИЛИ ВОПРОС</label>
        <textarea class="input" id="sceneTask"></textarea>
      </div>

      <div class="field">
        <label>ФОТО ИЛИ ВИДЕО СЦЕНЫ</label>

        <div class="media-row">
          <select class="input" id="sceneMediaType">
            <option value="none">Без медиа</option>
            <option value="image">Изображение</option>
            <option value="video">Видео</option>
          </select>

          <input
            class="input"
            id="sceneMediaUrl"
            placeholder="Вставьте прямую ссылку"
          >
        </div>

        <div id="sceneMediaPreview"></div>
      </div>

      <div class="section-title">
        <div>
          <h2>Варианты ответа</h2>
          <p>Каждый вариант может вести в любую сцену.</p>
        </div>

        <button class="button" id="addAnswerButton">
          ＋ Добавить ответ
        </button>
      </div>

      <div class="answers" id="answersList"></div>

      <section class="design-box">
        <h2>Оформление игры</h2>

        <div class="design-grid">
          <div class="field">
            <label for="interfaceLanguage">ЯЗЫК</label>

            <select class="input" id="interfaceLanguage">
              <option value="ru">Русский</option>
              <option value="en">English</option>
            </select>
          </div>

          <div class="field">
            <label for="fontFamily">ШРИФТ</label>

            <select class="input" id="fontFamily">
              <option value="Inter, Arial, sans-serif">Inter</option>
              <option value="Arial, sans-serif">Arial</option>
              <option value="Georgia, serif">Georgia</option>
              <option value="'Courier New', monospace">
                Courier New
              </option>
            </select>
          </div>

          <div class="field">
            <label>ЦВЕТ ФОНА</label>

            <div class="color-field">
              <input type="color" id="backgroundColor">
              <input class="input" id="backgroundColorText">
            </div>
          </div>

          <div class="field">
            <label>АКЦЕНТНЫЙ ЦВЕТ</label>

            <div class="color-field">
              <input type="color" id="accentColor">
              <input class="input" id="accentColorText">
            </div>
          </div>

          <div class="field">
            <label for="buttonStyle">ФОРМА КНОПОК</label>

            <select class="input" id="buttonStyle">
              <option value="rounded">Круглые</option>
              <option value="soft">Скруглённые</option>
              <option value="square">Прямоугольные</option>
            </select>
          </div>

          <div class="field">
            <label for="backgroundImage">ОБЩИЙ ФОН</label>

            <input
              class="input"
              id="backgroundImage"
              placeholder="Необязательная ссылка на изображение"
            >
          </div>
        </div>
      </section>
    </section>

    <aside class="preview-column">
      <span class="eyebrow">ПРЕДПРОСМОТР</span>
      <h2>Экран ученика</h2>
      <div id="livePreview"></div>
    </aside>
  </main>

  <div class="modal" id="previewModal">
    <button
      class="button close-preview"
      id="closePreviewButton"
    >
      ← Вернуться в редактор
    </button>

    <div id="fullPreview"></div>
  </div>

  <script>
    const STORAGE_KEY = "branchway-editor-project-v1";

    function createId(prefix) {
      return (
        prefix +
        "-" +
        Date.now().toString(36) +
        Math.random().toString(36).slice(2, 7)
      );
    }

    function createDefaultProject() {
      return {
        version: 1,
        title: "Lost in London",
        description:
          "Интерактивная история для урока английского языка",

        startSceneId: "scene-1",

        theme: {
          language: "ru",
          fontFamily: "Inter, Arial, sans-serif",
          background: "#10172d",
          backgroundImage: "",
          accent: "#9bf6b0",
          buttonStyle: "soft"
        },

        scenes: [
          {
            id: "scene-1",
            title: "At the crossroads",
            task:
              "You are lost in London. Which direction should you choose?",

            media: {
              type: "image",
              url:
                "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1200&q=80"
            },

            answers: [
              {
                id: "answer-1",
                text: "Turn left",
                icon: "←",
                nextSceneId: "scene-2",

                transitionMedia: {
                  type: "none",
                  url: ""
                }
              },
              {
                id: "answer-2",
                text: "Turn right",
                icon: "→",
                nextSceneId: "scene-3",

                transitionMedia: {
                  type: "none",
                  url: ""
                }
              }
            ]
          },

          {
            id: "scene-2",
            title: "The right direction",
            task:
              "Great! You can see the station. What should you do next?",

            media: {
              type: "image",
              url:
                "https://images.unsplash.com/photo-1529655683826-aba9b3e77383?auto=format&fit=crop&w=1200&q=80"
            },

            answers: [
              {
                id: "answer-3",
                text: "Go to the station",
                icon: "🚇",
                nextSceneId: "scene-4",

                transitionMedia: {
                  type: "none",
                  url: ""
                }
              }
            ]
          },

          {
            id: "scene-3",
            title: "A wrong turn",
            task:
              "This street is a dead end. Choose another direction.",

            media: {
              type: "image",
              url:
                "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1200&q=80"
            },

            answers: [
              {
                id: "answer-4",
                text: "Go back",
                icon: "↩",
                nextSceneId: "scene-1",

                transitionMedia: {
                  type: "none",
                  url: ""
                }
              }
            ]
          },

          {
            id: "scene-4",
            title: "You won!",
            task:
              "Congratulations! You successfully found the station.",

            media: {
              type: "none",
              url: ""
            },

            answers: [
              {
                id: "answer-5",
                text: "Play again",
                icon: "✦",
                nextSceneId: "scene-1",

                transitionMedia: {
                  type: "none",
                  url: ""
                }
              }
            ]
          }
        ]
      };
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadProject() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
          return JSON.parse(saved);
        }
      } catch (error) {
        console.error("Не удалось загрузить проект", error);
      }

      return createDefaultProject();
    }

    let project = loadProject();
    let activeSceneId = project.startSceneId;
    let previewSceneId = project.startSceneId;

    const elements = {
      projectTitle: document.querySelector("#projectTitle"),
      projectDescription: document.querySelector(
        "#projectDescription"
      ),

      sceneList: document.querySelector("#sceneList"),
      sceneNumber: document.querySelector("#sceneNumber"),
      editorSceneTitle: document.querySelector(
        "#editorSceneTitle"
      ),

      sceneTitle: document.querySelector("#sceneTitle"),
      sceneTask: document.querySelector("#sceneTask"),
      sceneMediaType: document.querySelector(
        "#sceneMediaType"
      ),
      sceneMediaUrl: document.querySelector("#sceneMediaUrl"),
      sceneMediaPreview: document.querySelector(
        "#sceneMediaPreview"
      ),

      answersList: document.querySelector("#answersList"),
      livePreview: document.querySelector("#livePreview"),
      fullPreview: document.querySelector("#fullPreview"),
      previewModal: document.querySelector("#previewModal"),

      makeStartButton: document.querySelector(
        "#makeStartButton"
      ),

      interfaceLanguage: document.querySelector(
        "#interfaceLanguage"
      ),
      fontFamily: document.querySelector("#fontFamily"),
      backgroundColor: document.querySelector(
        "#backgroundColor"
      ),
      backgroundColorText: document.querySelector(
        "#backgroundColorText"
      ),
      accentColor: document.querySelector("#accentColor"),
      accentColorText: document.querySelector(
        "#accentColorText"
      ),
      buttonStyle: document.querySelector("#buttonStyle"),
      backgroundImage: document.querySelector(
        "#backgroundImage"
      )
    };

    function getActiveScene() {
      return (
        project.scenes.find(
          scene => scene.id === activeSceneId
        ) || project.scenes[0]
      );
    }

    function saveProject() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(project)
      );
    }

    function escapeHtml(value) {
      return String(value || "").replace(
        /[&<>"']/g,
        character => {
          const characters = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          };

          return characters[character];
        }
      );
    }

    function safeCssUrl(url) {
      return String(url || "")
        .replace(/\\/g, "")
        .replace(/"/g, "%22");
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;

      document.body.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 2200);
    }

    function render() {
      const scene = getActiveScene();

      if (!scene) {
        return;
      }

      document.documentElement.style.setProperty(
        "--accent",
        project.theme.accent
      );

      elements.projectTitle.value = project.title;
      elements.projectDescription.value =
        project.description;

      elements.sceneTitle.value = scene.title;
      elements.sceneTask.value = scene.task;
      elements.sceneMediaType.value = scene.media.type;
      elements.sceneMediaUrl.value = scene.media.url;

      const currentIndex = project.scenes.findIndex(
        item => item.id === scene.id
      );

      elements.sceneNumber.textContent =
        "СЦЕНА " +
        String(currentIndex + 1).padStart(2, "0");

      elements.editorSceneTitle.textContent =
        scene.title || "Без названия";

      elements.makeStartButton.textContent =
        scene.id === project.startSceneId
          ? "★ Стартовая сцена"
          : "☆ Сделать стартовой";

      elements.interfaceLanguage.value =
        project.theme.language;

      elements.fontFamily.value =
        project.theme.fontFamily;

      elements.backgroundColor.value =
        project.theme.background;

      elements.backgroundColorText.value =
        project.theme.background;

      elements.accentColor.value =
        project.theme.accent;

      elements.accentColorText.value =
        project.theme.accent;

      elements.buttonStyle.value =
        project.theme.buttonStyle;

      elements.backgroundImage.value =
        project.theme.backgroundImage;

      renderSceneList();
      renderAnswers();
      renderMediaPreview();
      renderPlayer(elements.livePreview, scene, false);

      saveProject();
    }

    function renderSceneList() {
      elements.sceneList.innerHTML = "";

      project.scenes.forEach((scene, index) => {
        const button = document.createElement("button");

        button.className =
          "scene-card" +
          (scene.id === activeSceneId ? " active" : "");

        button.innerHTML = `
          <span class="scene-number">
            ${String(index + 1).padStart(2, "0")}
          </span>

          <span class="scene-info">
            <strong>${escapeHtml(scene.title)}</strong>
            <small>
              ${scene.answers.length} вариантов
            </small>
          </span>

          ${
            scene.id === project.startSceneId
              ? '<span class="start-indicator">★</span>'
              : ""
          }
        `;

        button.addEventListener("click", () => {
          activeSceneId = scene.id;
          render();
        });

        elements.sceneList.appendChild(button);
      });
    }

    function renderMediaPreview() {
      const scene = getActiveScene();
      const media = scene.media;

      elements.sceneMediaPreview.innerHTML = "";

      if (!media.url || media.type === "none") {
        return;
      }

      if (media.type === "image") {
        const image = document.createElement("img");
        image.className = "media-preview";
        image.src = media.url;
        image.alt = "Предпросмотр изображения";

        elements.sceneMediaPreview.appendChild(image);
      }

      if (media.type === "video") {
        const video = document.createElement("video");
        video.className = "media-preview";
        video.src = media.url;
        video.controls = true;
        video.muted = true;

        elements.sceneMediaPreview.appendChild(video);
      }
    }

    function renderAnswers() {
      const scene = getActiveScene();

      elements.answersList.innerHTML = "";

      scene.answers.forEach((answer, index) => {
        const card = document.createElement("article");
        card.className = "answer-card";

        const sceneOptions = project.scenes
          .map(targetScene => {
            const selected =
              targetScene.id === answer.nextSceneId
                ? "selected"
                : "";

            return `
              <option
                value="${escapeHtml(targetScene.id)}"
                ${selected}
              >
                ${escapeHtml(targetScene.title)}
              </option>
            `;
          })
          .join("");

        card.innerHTML = `
          <div class="answer-card-header">
            <strong>
              ВАРИАНТ ${String(index + 1).padStart(2, "0")}
            </strong>

            <button
              class="delete-answer"
              data-action="delete"
              title="Удалить ответ"
            >
              Удалить
            </button>
          </div>

          <div class="answer-row">
            <div>
              <label>ИКОНКА</label>
              <input
                class="input"
                data-field="icon"
                value="${escapeHtml(answer.icon)}"
              >
            </div>

            <div>
              <label>ТЕКСТ ОТВЕТА</label>
              <input
                class="input"
                data-field="text"
                value="${escapeHtml(answer.text)}"
              >
            </div>
          </div>

          <div class="field">
            <label>ПЕРЕХОД К СЦЕНЕ</label>

            <select
              class="input"
              data-field="nextSceneId"
            >
              <option value="">
                Выберите сцену
              </option>

              ${sceneOptions}
            </select>
          </div>

          <div class="answer-options">
            <div>
              <label>МЕДИА ПЕРЕХОДА</label>

              <select
                class="input"
                data-field="transitionType"
              >
                <option
                  value="none"
                  ${
                    answer.transitionMedia.type === "none"
                      ? "selected"
                      : ""
                  }
                >
                  Без медиа
                </option>

                <option
                  value="image"
                  ${
                    answer.transitionMedia.type === "image"
                      ? "selected"
                      : ""
                  }
                >
                  Изображение
                </option>

                <option
                  value="video"
                  ${
                    answer.transitionMedia.type === "video"
                      ? "selected"
                      : ""
                  }
                >
                  Видео
                </option>
              </select>
            </div>

            <div>
              <label>ССЫЛКА</label>

              <input
                class="input"
                data-field="transitionUrl"
                value="${
                  escapeHtml(answer.transitionMedia.url)
                }"
                placeholder="https://..."
              >
            </div>
          </div>
        `;

        card
          .querySelector('[data-field="icon"]')
          .addEventListener("input", event => {
            answer.icon = event.target.value;
            renderPlayer(
              elements.livePreview,
              getActiveScene(),
              false
            );
            saveProject();
          });

        card
          .querySelector('[data-field="text"]')
          .addEventListener("input", event => {
            answer.text = event.target.value;
            renderPlayer(
              elements.livePreview,
              getActiveScene(),
              false
            );
            saveProject();
          });

        card
          .querySelector('[data-field="nextSceneId"]')
          .addEventListener("change", event => {
            answer.nextSceneId = event.target.value;
            saveProject();
          });

        card
          .querySelector('[data-field="transitionType"]')
          .addEventListener("change", event => {
            answer.transitionMedia.type =
              event.target.value;
            saveProject();
          });

        card
          .querySelector('[data-field="transitionUrl"]')
          .addEventListener("input", event => {
            answer.transitionMedia.url =
              event.target.value;
            saveProject();
          });

        card
          .querySelector('[data-action="delete"]')
          .addEventListener("click", () => {
            if (scene.answers.length === 1) {
              showToast(
                "В сцене должен остаться хотя бы один ответ"
              );
              return;
            }

            scene.answers = scene.answers.filter(
              item => item.id !== answer.id
            );

            render();
          });

        elements.answersList.appendChild(card);
      });
    }

    function renderPlayer(container, scene, interactive) {
      container.innerHTML = "";

      const player = document.createElement("div");
      player.className =
        "player" + (interactive ? " modal-player" : "");

      player.style.backgroundColor =
        project.theme.background;

      player.style.fontFamily =
        project.theme.fontFamily;

      if (
        scene.media.type === "image" &&
        scene.media.url
      ) {
        player.style.backgroundImage =
          `url("${safeCssUrl(scene.media.url)}")`;
      } else if (project.theme.backgroundImage) {
        player.style.backgroundImage =
          `url("${safeCssUrl(
            project.theme.backgroundImage
          )}")`;
      }

      if (
        scene.media.type === "video" &&
        scene.media.url
      ) {
        const video = document.createElement("video");
        video.className = "player-video";
        video.src = scene.media.url;
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;

        player.appendChild(video);
      }

      const currentIndex = project.scenes.findIndex(
        item => item.id === scene.id
      );

      const overlay = document.createElement("div");
      overlay.className = "player-overlay";

      overlay.innerHTML = `
        <div class="player-top">
          <span>✦ ${escapeHtml(project.title)}</span>

          <span>
            ${currentIndex + 1} / ${project.scenes.length}
          </span>
        </div>

        <div>
          <span class="player-label">
            ${escapeHtml(scene.title)}
          </span>

          <h3>${escapeHtml(scene.task)}</h3>

          <div class="player-answers"></div>
        </div>
      `;

      const answersContainer =
        overlay.querySelector(".player-answers");

      scene.answers.forEach(answer => {
        const button = document.createElement("button");

        button.className =
          "player-answer shape-" +
          project.theme.buttonStyle;

        button.innerHTML = `
          <span>${escapeHtml(answer.icon)}</span>
          <span>${escapeHtml(answer.text)}</span>
        `;

        if (interactive) {
          button.addEventListener("click", () => {
            playAnswer(answer);
          });
        }

        answersContainer.appendChild(button);
      });

      player.appendChild(overlay);
      container.appendChild(player);
    }

    function playAnswer(answer) {
      const transition = answer.transitionMedia;

      if (
        transition &&
        transition.type !== "none" &&
        transition.url
      ) {
        showTransition(answer);
        return;
      }

      goToNextScene(answer);
    }

    function goToNextScene(answer) {
      previewSceneId =
        answer.nextSceneId || project.startSceneId;

      const nextScene =
        project.scenes.find(
          scene => scene.id === previewSceneId
        ) || project.scenes[0];

      renderPlayer(elements.fullPreview, nextScene, true);
    }

    function showTransition(answer) {
      const transition = answer.transitionMedia;

      elements.fullPreview.innerHTML = "";

      const wrapper = document.createElement("div");
      wrapper.className = "player modal-player";
      wrapper.style.backgroundColor =
        project.theme.background;

      if (transition.type === "image") {
        wrapper.style.backgroundImage =
          `url("${safeCssUrl(transition.url)}")`;

        wrapper.style.backgroundSize = "cover";
        wrapper.style.backgroundPosition = "center";

        setTimeout(() => {
          goToNextScene(answer);
        }, 1800);
      }

      if (transition.type === "video") {
        const video = document.createElement("video");
        video.className = "player-video";
        video.src = transition.url;
        video.autoplay = true;
        video.controls = true;
        video.playsInline = true;

        video.addEventListener("ended", () => {
          goToNextScene(answer);
        });

        wrapper.appendChild(video);
      }

      elements.fullPreview.appendChild(wrapper);
    }

    function addScene() {
      const newScene = {
        id: createId("scene"),
        title: "Новая сцена",
        task: "Введите задание для ученика.",

        media: {
          type: "none",
          url: ""
        },

        answers: [
          {
            id: createId("answer"),
            text: "Продолжить",
            icon: "→",
            nextSceneId: project.startSceneId,

            transitionMedia: {
              type: "none",
              url: ""
            }
          }
        ]
      };

      project.scenes.push(newScene);
      activeSceneId = newScene.id;

      render();
    }

    function deleteActiveScene() {
      if (project.scenes.length === 1) {
        showToast("Нельзя удалить единственную сцену");
        return;
      }

      const deletedId = activeSceneId;

      project.scenes = project.scenes.filter(
        scene => scene.id !== deletedId
      );

      const fallbackScene = project.scenes[0];

      project.scenes.forEach(scene => {
        scene.answers.forEach(answer => {
          if (answer.nextSceneId === deletedId) {
            answer.nextSceneId = fallbackScene.id;
          }
        });
      });

      if (project.startSceneId === deletedId) {
        project.startSceneId = fallbackScene.id;
      }

      activeSceneId = fallbackScene.id;
      render();
    }

    function addAnswer() {
      const scene = getActiveScene();

      scene.answers.push({
        id: createId("answer"),
        text: "Новый вариант",
        icon: "→",
        nextSceneId: project.startSceneId,

        transitionMedia: {
          type: "none",
          url: ""
        }
      });

      render();
    }

    function downloadFile(content, filename, type) {
      const blob = new Blob([content], {
        type: type
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;
      link.click();

      URL.revokeObjectURL(url);
    }

    function slugify(value) {
      return String(value || "branchway-game")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9а-яё]+/gi, "-")
        .replace(/^-|-$/g, "");
    }

    function exportJson() {
      downloadFile(
        JSON.stringify(project, null, 2),
        slugify(project.title) + ".json",
        "application/json"
      );
    }

    function importJson(file) {
      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.addEventListener("load", () => {
        try {
          const imported = JSON.parse(reader.result);

          if (
            !imported.scenes ||
            !Array.isArray(imported.scenes) ||
            imported.scenes.length === 0
          ) {
            throw new Error("Некорректный проект");
          }

          project = imported;
          activeSceneId =
            project.startSceneId || project.scenes[0].id;

          previewSceneId = activeSceneId;

          render();
          showToast("Проект загружен");
        } catch (error) {
          console.error(error);
          showToast("Не удалось загрузить JSON");
        }
      });

      reader.readAsText(file);
    }

    function buildGameHtml() {
      const gameJson = JSON.stringify(project).replace(
        /</g,
        "\\u003c"
      );

      return `<!DOCTYPE html>
<html lang="${project.theme.language}">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>${escapeHtml(project.title)}</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: white;
      background: ${project.theme.background};
      font-family: ${project.theme.fontFamily};
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .game {
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background-size: cover;
      background-position: center;
    }

    .card {
      width: min(850px, 100%);
      min-height: min(720px, calc(100vh - 40px));
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background-color: ${project.theme.background};
      background-size: cover;
      background-position: center;
      box-shadow: 0 25px 90px rgba(0, 0, 0, 0.5);
    }

    .scene-video,
    .transition-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      padding: clamp(22px, 5vw, 50px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(
          180deg,
          rgba(5, 10, 22, 0.12),
          rgba(5, 10, 22, 0.96) 84%
        );
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .label {
      color: ${project.theme.accent};
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 12px 0 30px;
      font-size: clamp(31px, 6vw, 62px);
      line-height: 1.04;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: white;
      background: rgba(255, 255, 255, 0.1);
      text-align: left;
      border-radius: ${
        project.theme.buttonStyle === "rounded"
          ? "999px"
          : project.theme.buttonStyle === "square"
            ? "4px"
            : "14px"
      };
    }

    .answer:hover {
      color: #101827;
      background: ${project.theme.accent};
    }

    .transition {
      position: absolute;
      inset: 0;
      z-index: 10;
      background-color: ${project.theme.background};
      background-size: cover;
      background-position: center;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const game = ${gameJson};
    let currentSceneId = game.startSceneId;

    function escapeHtml(value) {
      return String(value || "").replace(
        /[&<>"']/g,
        character => {
          const characters = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          };

          return characters[character];
        }
      );
    }

    function safeUrl(value) {
      return String(value || "")
        .replace(/\\\\/g, "")
        .replace(/"/g, "%22");
    }

    function getScene() {
      return (
        game.scenes.find(
          scene => scene.id === currentSceneId
        ) || game.scenes[0]
      );
    }

    function render() {
      const scene = getScene();
      const index = game.scenes.findIndex(
        item => item.id === scene.id
      );

      const image =
        scene.media &&
        scene.media.type === "image" &&
        scene.media.url
          ? scene.media.url
          : game.theme.backgroundImage || "";

      document.querySelector("#app").innerHTML = \`
        <main
          class="game"
          style="
            background-color: \${game.theme.background};
            \${
              game.theme.backgroundImage
                ? \`background-image:url('\${safeUrl(
                    game.theme.backgroundImage
                  )}')\`
                : ""
            }
          "
        >
          <section
            class="card"
            style="
              background-color: \${game.theme.background};
              \${
                image
                  ? \`background-image:url('\${safeUrl(
                      image
                    )}')\`
                  : ""
              }
            "
          >
            \${
              scene.media &&
              scene.media.type === "video" &&
              scene.media.url
                ? \`
                  <video
                    class="scene-video"
                    src="\${escapeHtml(scene.media.url)}"
                    autoplay
                    muted
                    loop
                    playsinline
                  ></video>
                \`
                : ""
            }

            <div class="overlay">
              <div class="top">
                <span>✦ \${escapeHtml(game.title)}</span>
                <span>\${index + 1} / \${game.scenes.length}</span>
              </div>

              <div>
                <span class="label">
                  \${escapeHtml(scene.title)}
                </span>

                <h1>\${escapeHtml(scene.task)}</h1>

                <div class="answers">
                  \${scene.answers
                    .map(
                      (answer, answerIndex) => \`
                        <button
                          class="answer"
                          data-answer="\${answerIndex}"
                        >
                          <span>
                            \${escapeHtml(answer.icon)}
                          </span>

                          <span>
                            \${escapeHtml(answer.text)}
                          </span>
                        </button>
                      \`
                    )
                    .join("")}
                </div>
              </div>
            </div>
          </section>
        </main>
      \`;

      document
        .querySelectorAll("[data-answer]")
        .forEach(button => {
          button.addEventListener("click", () => {
            const answer =
              scene.answers[
                Number(button.dataset.answer)
              ];

            playAnswer(answer);
          });
        });
    }

    function playAnswer(answer) {
      const transition = answer.transitionMedia;

      if (
        !transition ||
        transition.type === "none" ||
        !transition.url
      ) {
        openNextScene(answer);
        return;
      }

      const card = document.querySelector(".card");
      const layer = document.createElement("div");

      layer.className = "transition";

      if (transition.type === "image") {
        layer.style.backgroundImage =
          \`url("\${safeUrl(transition.url)}")\`;

        card.appendChild(layer);

        setTimeout(() => {
          openNextScene(answer);
        }, 1800);
      }

      if (transition.type === "video") {
        layer.innerHTML = \`
          <video
            class="transition-video"
            src="\${escapeHtml(transition.url)}"
            autoplay
            controls
            playsinline
          ></video>
        \`;

        card.appendChild(layer);

        const video = layer.querySelector("video");

        video.addEventListener("ended", () => {
          openNextScene(answer);
        });
      }
    }

    function openNextScene(answer) {
      currentSceneId =
        answer.nextSceneId || game.startSceneId;

      render();
    }

    render();
  <\/script>
</body>
</html>`;
    }

    function exportGame() {
      downloadFile(
        buildGameHtml(),
        slugify(project.title) + ".html",
        "text/html"
      );
    }

    elements.projectTitle.addEventListener(
      "input",
      event => {
        project.title = event.target.value;
        renderPlayer(
          elements.livePreview,
          getActiveScene(),
          false
        );
        saveProject();
      }
    );

    elements.projectDescription.addEventListener(
      "input",
      event => {
        project.description = event.target.value;
        saveProject();
      }
    );

    elements.sceneTitle.addEventListener(
      "input",
      event => {
        getActiveScene().title = event.target.value;
        render();
      }
    );

    elements.sceneTask.addEventListener(
      "input",
      event => {
        getActiveScene().task = event.target.value;

        renderPlayer(
          elements.livePreview,
          getActiveScene(),
          false
        );

        saveProject();
      }
    );

    elements.sceneMediaType.addEventListener(
      "change",
      event => {
        getActiveScene().media.type = event.target.value;
        render();
      }
    );

    elements.sceneMediaUrl.addEventListener(
      "input",
      event => {
        getActiveScene().media.url = event.target.value;

        renderMediaPreview();

        renderPlayer(
          elements.livePreview,
          getActiveScene(),
          false
        );

        saveProject();
      }
    );

    elements.interfaceLanguage.addEventListener(
      "change",
      event => {
        project.theme.language = event.target.value;
        saveProject();
      }
    );

    elements.fontFamily.addEventListener(
      "change",
      event => {
        project.theme.fontFamily = event.target.value;
        render();
      }
    );

    function changeBackgroundColor(value) {
      project.theme.background = value;
      render();
    }

    elements.backgroundColor.addEventListener(
      "input",
      event => {
        changeBackgroundColor(event.target.value);
      }
    );

    elements.backgroundColorText.addEventListener(
      "change",
      event => {
        changeBackgroundColor(event.target.value);
      }
    );

    function changeAccentColor(value) {
      project.theme.accent = value;
      render();
    }

    elements.accentColor.addEventListener(
      "input",
      event => {
        changeAccentColor(event.target.value);
      }
    );

    elements.accentColorText.addEventListener(
      "change",
      event => {
        changeAccentColor(event.target.value);
      }
    );

    elements.buttonStyle.addEventListener(
      "change",
      event => {
        project.theme.buttonStyle = event.target.value;
        render();
      }
    );

    elements.backgroundImage.addEventListener(
      "input",
      event => {
        project.theme.backgroundImage =
          event.target.value;

        renderPlayer(
          elements.livePreview,
          getActiveScene(),
          false
        );

        saveProject();
      }
    );

    document
      .querySelector("#addSceneButton")
      .addEventListener("click", addScene);

    document
      .querySelector("#addAnswerButton")
      .addEventListener("click", addAnswer);

    document
      .querySelector("#deleteSceneButton")
      .addEventListener("click", deleteActiveScene);

    elements.makeStartButton.addEventListener(
      "click",
      () => {
        project.startSceneId = activeSceneId;
        render();
      }
    );

    document
      .querySelector("#exportJsonButton")
      .addEventListener("click", exportJson);

    document
      .querySelector("#importJsonInput")
      .addEventListener("change", event => {
        importJson(event.target.files[0]);
        event.target.value = "";
      });

    document
      .querySelector("#exportGameButton")
      .addEventListener("click", exportGame);

    document
      .querySelector("#previewButton")
      .addEventListener("click", () => {
        previewSceneId = project.startSceneId;

        const startScene =
          project.scenes.find(
            scene => scene.id === previewSceneId
          ) || project.scenes[0];

        renderPlayer(
          elements.fullPreview,
          startScene,
          true
        );

        elements.previewModal.classList.add("open");
      });

    document
      .querySelector("#closePreviewButton")
      .addEventListener("click", () => {
        elements.previewModal.classList.remove("open");
      });

    document
      .querySelector("#resetButton")
      .addEventListener("click", () => {
        const confirmed = confirm(
          "Создать новый проект? Текущий проект будет удалён из браузера."
        );

        if (!confirmed) {
          return;
        }

        project = createDefaultProject();
        activeSceneId = project.startSceneId;
        previewSceneId = project.startSceneId;

        render();
        showToast("Создан новый проект");
      });

    render();
  </script>
</body>
</html>
