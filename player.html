<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Interactive game</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Roboto+Slab:wght@400;700&family=Rye&family=Special+Elite&display=swap"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: transparent;
    }

    body {
      color: #fff;
      font-family: Arial, sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    #app {
      min-height: 100vh;
      padding: 12px;

      display: grid;
      place-items: center;
    }

    .card {
      position: relative;

      width: 100%;
      min-height: calc(100vh - 24px);

      overflow: hidden;
      border-radius: 18px;

      background-size: cover;
      background-position: center;
    }

    .video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;

      padding: clamp(20px, 5vw, 48px);

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .shade {
      background:
        linear-gradient(
          180deg,
          rgba(7, 16, 29, 0.08),
          rgba(7, 16, 29, 0.92) 84%
        );
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 20px;

      font-family: var(--heading);

      font-size: clamp(27px, 5vw, 54px);
      line-height: 1.15;
    }

    p {
      font-size: clamp(15px, 2vw, 20px);
      line-height: 1.55;
    }

    .story {
      padding: clamp(18px, 4vw, 34px);
    }

    .style-none {
      padding: 0;
    }

    .style-vintage {
      border: 3px solid var(--border);
      border-radius: 16px;

      color: #f7e4c8;

      background:
        linear-gradient(
          135deg,
          rgba(20, 11, 8, 0.96),
          rgba(35, 18, 12, 0.93)
        );

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.67),
        inset 0 0 30px
          rgba(111, 55, 26, 0.2);
    }

    .style-glass {
      border: 1px solid
        rgba(255, 255, 255, 0.33);

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.09);

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.4);

      backdrop-filter: blur(12px);
    }

    .style-neon {
      border: 2px solid var(--border);
      border-radius: 12px;

      background: rgba(6, 11, 24, 0.86);

      box-shadow:
        0 0 10px var(--border),
        inset 0 0 18px #000;
    }

    .style-parchment {
      border: 2px solid #79552f;
      border-radius: 4px;

      color: #332414;
      background: rgba(234, 215, 171, 0.92);

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.53);
    }

    .answers {
      display: grid;
      gap: 9px;
      margin-top: 16px;
    }

    .answer {
      width: 100%;
      padding: 14px 17px;

      display: flex;
      align-items: center;
      gap: 12px;

      color: #fff;
      text-align: left;
    }

    .answer-standard {
      border: 1px solid
        rgba(255, 255, 255, 0.21);

      background:
        rgba(17, 24, 39, 0.77);
    }

    .answer-vintage {
      border: 2px solid var(--border);

      color: #f7e4c8;
      background: rgba(26, 13, 9, 0.91);
    }

    .answer-double {
      border: 4px double var(--border);

      background:
        rgba(17, 24, 39, 0.79);
    }

    .answer-neon {
      border: 1px solid var(--border);

      background:
        rgba(7, 16, 29, 0.9);

      box-shadow:
        0 0 7px var(--border);
    }

    .answer-dashed {
      border: 2px dashed var(--border);

      background:
        rgba(17, 24, 39, 0.67);
    }

    .answer-text {
      border: 0;
      border-bottom: 1px solid var(--border);

      border-radius: 0 !important;
      background: transparent;
    }

    .answer:hover {
      color: #101827;
      background: var(--accent);
    }

    .shape-soft {
      border-radius: 12px;
    }

    .shape-round {
      border-radius: 999px;
    }

    .shape-square {
      border-radius: 3px;
    }

    /* Прогресс */

    .progress {
      position: absolute;

      left: clamp(20px, 5vw, 48px);
      right: clamp(20px, 5vw, 48px);
      bottom: 18px;

      z-index: 22;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;

      margin-bottom: 7px;

      font-size: 10px;
      font-weight: 900;

      text-shadow: 0 1px 5px #000;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;

      border: 1px solid
        rgba(255, 255, 255, 0.25);

      border-radius: 999px;

      background:
        rgba(5, 9, 20, 0.55);
    }

    .progress-fill {
      height: 100%;

      border-radius: 999px;
      background: var(--accent);

      box-shadow:
        0 0 14px var(--accent);

      transition: width 0.5s;
    }

    .has-progress .overlay {
      padding-bottom: 76px;
    }

    /* Эффекты */

    .effect {
      position: absolute;
      inset: 0;
      z-index: 15;

      overflow: hidden;
      pointer-events: none;
    }

    .fog::before,
    .fog::after {
      content: "";

      position: absolute;
      inset: -30%;

      background:
        radial-gradient(
          ellipse at 30% 50%,
          rgba(238, 243, 242, 0.79),
          transparent 48%
        ),
        radial-gradient(
          ellipse at 75% 40%,
          rgba(191, 202, 201, 0.72),
          transparent 52%
        );

      filter: blur(25px);

      animation:
        fogMove 5s ease-in-out
        infinite alternate;
    }

    .fog::after {
      transform: scaleX(-1);
      opacity: 0.65;
      animation-duration: 7s;
    }

    .rain {
      background-image:
        repeating-linear-gradient(
          105deg,
          transparent 0 12px,
          rgba(189, 225, 255, 0.5) 13px 14px,
          transparent 15px 24px
        );

      background-size: 180px 180px;

      animation:
        rainFall 0.45s linear infinite;
    }

    .fire {
      top: 45%;

      background:
        radial-gradient(
          ellipse at 15% 110%,
          #ffeb3b 0 6%,
          #ff6500 18%,
          transparent 45%
        ),
        radial-gradient(
          ellipse at 50% 115%,
          #fff176 0 5%,
          #ff3d00 22%,
          transparent 48%
        ),
        radial-gradient(
          ellipse at 85% 110%,
          #ffca28 0 7%,
          #d50000 22%,
          transparent 48%
        );

      filter: blur(4px);

      animation:
        firePulse 0.45s
        ease-in-out infinite alternate;
    }

    .glitch {
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0 8px,
          rgba(0, 229, 255, 0.13) 9px 10px,
          rgba(255, 23, 68, 0.13) 11px 12px
        );

      mix-blend-mode: screen;

      animation:
        glitchEffect 0.18s
        steps(2) infinite;
    }

    .shake {
      animation:
        shakeEffect 0.55s linear infinite;
    }

    .low {
      opacity: 0.4;
    }

    .medium {
      opacity: 0.7;
    }

    .high {
      opacity: 1;
    }

    .transition {
      position: absolute;
      inset: 0;
      z-index: 25;

      background-size: cover;
      background-position: center;
    }

    @keyframes fogMove {
      from {
        transform:
          translateX(-12%) scale(1);
      }

      to {
        transform:
          translateX(12%) scale(1.15);
      }
    }

    @keyframes rainFall {
      to {
        background-position:
          -45px 180px;
      }
    }

    @keyframes firePulse {
      from {
        transform: scaleY(0.9);
      }

      to {
        transform: scaleY(1.08);
      }
    }

    @keyframes glitchEffect {
      0% {
        transform: translate(0);
      }

      25% {
        transform: translate(5px, -2px);
      }

      50% {
        transform: translate(-4px, 2px);
      }

      75% {
        transform: translate(3px, 1px);
      }
    }

    @keyframes shakeEffect {
      0%,
      100% {
        transform: translate(0);
      }

      20% {
        transform: translate(-6px, 3px);
      }

      40% {
        transform: translate(5px, -3px);
      }

      60% {
        transform: translate(-4px, -2px);
      }

      80% {
        transform: translate(4px, 3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .effect,
      .shake {
        animation: none !important;
      }
    }

    @media (max-width: 600px) {
      #app {
        padding: 0;
      }

      .card {
        min-height: 100vh;
        border-radius: 0;
      }

      .overlay {
        padding: 20px;
      }

      .has-progress .overlay {
        padding-bottom: 70px;
      }

      .progress {
        left: 20px;
        right: 20px;
      }

      .story {
        padding: 17px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    Loading…
  </div>

  <script>
    "use strict";

    const app =
      document.querySelector("#app");

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        character => {
          const replacements = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          };

          return replacements[character];
        }
      );
    }

    function decodeProject(value) {
      let base64 = value
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      while (base64.length % 4) {
        base64 += "=";
      }

      return JSON.parse(
        decodeURIComponent(
          escape(atob(base64))
        )
      );
    }

    function directMediaUrl(
      value,
      mediaType = "image"
    ) {
      const originalUrl =
        String(value || "").trim();

      if (!originalUrl) {
        return "";
      }

      try {
        const url =
          new URL(originalUrl);

        if (
          url.hostname.includes(
            "drive.google.com"
          )
        ) {
          let fileId = "";

          const pathMatch =
            url.pathname.match(
              /\/file\/d\/([^/]+)/
            );

          if (pathMatch) {
            fileId = pathMatch[1];
          }

          if (!fileId) {
            fileId =
              url.searchParams.get("id") ||
              "";
          }

          if (fileId) {
            if (mediaType === "image") {
              return (
                "https://lh3.googleusercontent.com/d/" +
                encodeURIComponent(fileId)
              );
            }

            return (
              "https://drive.google.com/uc" +
              "?export=download&id=" +
              encodeURIComponent(fileId)
            );
          }
        }

        if (
          url.hostname.includes(
            "dropbox.com"
          )
        ) {
          url.searchParams.delete("dl");
          url.searchParams.set("raw", "1");

          return url.toString();
        }

        return originalUrl;
      } catch (error) {
        return originalUrl;
      }
    }

    let game;

    try {
      game = decodeProject(
        location.hash.slice(1)
      );
    } catch (error) {
      console.error(error);

      app.textContent =
        "Game data could not be loaded.";

      throw error;
    }

    const themeDefaults = {
      headingFont: "Rye",
      bodyFont: "Courier Prime",
      cardStyle: "vintage",
      answerStyle: "vintage",
      shape: "soft",
      borderColor: "#d8ae7b",
      showProgress: true,
      reduceMotion: false
    };

    game.theme = {
      ...themeDefaults,
      ...game.theme
    };

    game.scenes.forEach(scene => {
      scene.atmosphere = {
        type: "none",
        intensity: "medium",
        duration: 1800,
        ...(scene.atmosphere || {})
      };
    });

    let currentSceneId =
      game.startSceneId;

    let visitedScenes =
      new Set([currentSceneId]);

    document.title =
      game.title || "Interactive game";

    document.body.style.background =
      game.theme.transparent
        ? "transparent"
        : game.theme.background;

    function getButtonRadius() {
      if (game.theme.shape === "round") {
        return "999px";
      }

      if (game.theme.shape === "square") {
        return "3px";
      }

      return "12px";
    }

    function getDistanceToFinish(
      startSceneId
    ) {
      const queue = [[startSceneId, 0]];
      const checked = new Set();

      while (queue.length > 0) {
        const [sceneId, distance] =
          queue.shift();

        if (checked.has(sceneId)) {
          continue;
        }

        checked.add(sceneId);

        const scene =
          game.scenes.find(
            item => item.id === sceneId
          );

        if (!scene) {
          continue;
        }

        const hasFinish =
          scene.answers.some(
            answer =>
              answer.action === "finish" ||
              answer.nextSceneId ===
                "__finish__"
          );

        if (hasFinish) {
          return distance + 1;
        }

        scene.answers.forEach(answer => {
          if (
            answer.action !== "finish" &&
            answer.nextSceneId &&
            !checked.has(answer.nextSceneId)
          ) {
            queue.push([
              answer.nextSceneId,
              distance + 1
            ]);
          }
        });
      }

      return game.scenes.length;
    }

    function calculateProgress(
      finished = false
    ) {
      if (finished) {
        return 100;
      }

      const passed =
        Math.max(
          0,
          visitedScenes.size - 1
        );

      if (passed === 0) {
        return 0;
      }

      const remaining =
        getDistanceToFinish(
          currentSceneId
        );

      return Math.max(
        5,
        Math.min(
          95,
          Math.round(
            passed /
            (passed + remaining) *
            100
          )
        )
      );
    }

    function createProgressMarkup(
      finished = false
    ) {
      if (!game.theme.showProgress) {
        return "";
      }

      const progress =
        calculateProgress(finished);

      return `
        <div class="progress">
          <div class="progress-row">
            <span>Progress</span>
            <span>${progress}%</span>
          </div>

          <div class="progress-track">
            <div
              class="progress-fill"
              style="width:${progress}%"
            ></div>
          </div>
        </div>
      `;
    }

    function createEffectMarkup(
      atmosphere
    ) {
      if (
        game.theme.reduceMotion ||
        !atmosphere ||
        atmosphere.type === "none" ||
        atmosphere.type === "shake"
      ) {
        return "";
      }

      return `
        <div
          class="
            effect
            ${atmosphere.type}
            ${atmosphere.intensity}
          "
        ></div>
      `;
    }

    function applyTimedEffect(
      card,
      atmosphere
    ) {
      if (
        game.theme.reduceMotion ||
        !atmosphere ||
        atmosphere.type === "none"
      ) {
        return;
      }

      if (atmosphere.type === "shake") {
        card.classList.add("shake");
      }

      if (
        Number(atmosphere.duration) > 0
      ) {
        setTimeout(() => {
          const effect =
            card.querySelector(".effect");

          if (effect) {
            effect.remove();
          }

          card.classList.remove("shake");
        }, Number(atmosphere.duration));
      }
    }

    function renderScene() {
      const scene =
        game.scenes.find(
          item =>
            item.id === currentSceneId
        ) ||
        game.scenes[0];

      const sceneIndex =
        game.scenes.indexOf(scene);

      let backgroundImage = "";

      if (
        scene.media.type === "image" &&
        scene.media.url
      ) {
        backgroundImage =
          directMediaUrl(
            scene.media.url,
            "image"
          );
      } else if (
        !game.theme.transparent &&
        game.theme.backgroundImage
      ) {
        backgroundImage =
          directMediaUrl(
            game.theme.backgroundImage,
            "image"
          );
      }

      const hasMedia =
        (
          scene.media.type === "image" ||
          scene.media.type === "video"
        ) &&
        scene.media.url;

      const useShade =
        hasMedia ||
        !game.theme.transparent;

      app.innerHTML = `
        <section
          class="
            card
            ${
              game.theme.showProgress
                ? "has-progress"
                : ""
            }
          "
          style="
            --accent:${game.theme.accent};
            --border:${game.theme.borderColor};
            --heading:'${game.theme.headingFont}';

            font-family:
              '${game.theme.bodyFont}';

            background-color:
              ${
                game.theme.transparent
                  ? "transparent"
                  : game.theme.background
              };

            ${
              backgroundImage
                ? `background-image:
                    url('${escapeHtml(
                      backgroundImage
                    )}');`
                : ""
            }
          "
        >
          ${
            scene.media.type === "video" &&
            scene.media.url
              ? `
                <video
                  class="video"
                  src="${escapeHtml(
                    directMediaUrl(
                      scene.media.url,
                      "video"
                    )
                  )}"
                  autoplay
                  muted
                  loop
                  playsinline
                ></video>
              `
              : ""
          }

          <div
            class="overlay ${
              useShade ? "shade" : ""
            }"
          >
            <div class="top">
              <span>
                ${escapeHtml(game.title)}
              </span>

              <span>
                ${sceneIndex + 1}
                /
                ${game.scenes.length}
              </span>
            </div>

            <div
              class="
                story
                style-${game.theme.cardStyle}
              "
            >
              <span
                class="label"
                style="
                  color:${game.theme.accent}
                "
              >
                ${escapeHtml(scene.title)}
              </span>

              <h1>
                ${escapeHtml(scene.task)}
              </h1>

              <div class="answers">
                ${scene.answers
                  .map(
                    (answer, index) => `
                      <button
                        class="
                          answer
                          answer-${game.theme.answerStyle}
                        "
                        data-answer="${index}"
                        style="
                          border-radius:
                            ${getButtonRadius()}
                        "
                      >
                        <span>
                          ${escapeHtml(
                            answer.icon
                          )}
                        </span>

                        <span>
                          ${escapeHtml(
                            answer.text
                          )}
                        </span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
          </div>

          ${createEffectMarkup(
            scene.atmosphere
          )}

          ${createProgressMarkup(false)}
        </section>
      `;

      const card =
        document.querySelector(".card");

      applyTimedEffect(
        card,
        scene.atmosphere
      );

      document
        .querySelectorAll(
          "[data-answer]"
        )
        .forEach(button => {
          button.addEventListener(
            "click",
            () => {
              const answer =
                scene.answers[
                  Number(
                    button.dataset.answer
                  )
                ];

              playAnswer(answer);
            }
          );
        });
    }

    function showFinalFeedback() {
      const feedback =
        game.feedback || {};

      const feedbackImage =
        directMediaUrl(
          feedback.image,
          "image"
        );

      app.innerHTML = `
        <section
          class="
            card
            ${
              game.theme.showProgress
                ? "has-progress"
                : ""
            }
          "
          style="
            --accent:${game.theme.accent};
            --border:${game.theme.borderColor};
            --heading:'${game.theme.headingFont}';

            font-family:
              '${game.theme.bodyFont}';

            background-color:
              ${
                game.theme.transparent
                  ? "transparent"
                  : game.theme.background
              };

            ${
              feedbackImage
                ? `background-image:
                    url('${escapeHtml(
                      feedbackImage
                    )}');`
                : ""
            }
          "
        >
          <div
            class="overlay ${
              feedbackImage ||
              !game.theme.transparent
                ? "shade"
                : ""
            }"
          >
            <div></div>

            <div
              class="
                story
                style-${game.theme.cardStyle}
              "
            >
              <span
                class="label"
                style="
                  color:${game.theme.accent}
                "
              >
                FINISH
              </span>

              <h1>
                ${escapeHtml(
                  feedback.title ||
                  "Great work!"
                )}
              </h1>

              <p>
                ${escapeHtml(
                  feedback.text ||
                  "You completed the game."
                )}
              </p>

              <button
                id="restartButton"
                class="
                  answer
                  answer-${game.theme.answerStyle}
                "
                style="
                  border-radius:
                    ${getButtonRadius()}
                "
              >
                ${escapeHtml(
                  feedback.restartText ||
                  "Play again"
                )}
              </button>
            </div>
          </div>

          ${createProgressMarkup(true)}
        </section>
      `;

      document
        .querySelector("#restartButton")
        .addEventListener(
          "click",
          () => {
            currentSceneId =
              game.startSceneId;

            visitedScenes =
              new Set([currentSceneId]);

            renderScene();
          }
        );
    }

    function openNextScene(answer) {
      if (
        answer.action === "finish" ||
        answer.nextSceneId === "__finish__"
      ) {
        showFinalFeedback();
        return;
      }

      currentSceneId =
        answer.nextSceneId ||
        game.startSceneId;

      visitedScenes.add(currentSceneId);

      /*
        Новая сцена отрисовывается
        со своим атмосферным эффектом.
      */

      renderScene();
    }

    function playAnswer(answer) {
      const media =
        answer.transition;

      if (
        !media ||
        media.type === "none" ||
        !media.url
      ) {
        openNextScene(answer);
        return;
      }

      const card =
        document.querySelector(".card");

      const layer =
        document.createElement("div");

      layer.className = "transition";

      if (media.type === "image") {
        const imageUrl =
          directMediaUrl(
            media.url,
            "image"
          );

        layer.style.backgroundImage =
          `url("${imageUrl.replace(
            /"/g,
            "%22"
          )}")`;

        card.appendChild(layer);

        setTimeout(() => {
          openNextScene(answer);
        }, 1800);
      }

      if (media.type === "video") {
        const video =
          document.createElement("video");

        video.className = "video";

        video.src = directMediaUrl(
          media.url,
          "video"
        );

        video.autoplay = true;
        video.controls = true;
        video.playsInline = true;

        video.addEventListener(
          "ended",
          () => {
            openNextScene(answer);
          }
        );

        layer.appendChild(video);
        card.appendChild(layer);
      }
    }

    renderScene();
  </script>
</body>
</html>
