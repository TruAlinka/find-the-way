<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interactive game</title>
  <style>
    /* стили аналогично предыдущему примеру */
  </style>
</head>
<body>
  <div id="app">Loading…</div>

  <script>
    "use strict";

    function escapeHtml(v){ return String(v||"").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;", "\"":"&quot;","'":"&#039;" }[c])); }

    // загрузка data из hash
    function decode(str){
      const b = str.replace(/-/g,"+").replace(/_/g,"/");
      const json = atob(b);
      return JSON.parse(decodeURIComponent(escape(atob(b))));
    }

    const encoded = location.hash.slice(1);
    const game = decode(encoded);

    // прогресс по основным сценам
    const mains = game.scenes.filter(s => s.role !== "support");
    let currentMainIndex = 0;

    function renderScene(scene){
      // отображение текущей сцены, включая прогресс
      // вычисление прогресса
      const total = mains.length || 1;
      const idx = mains.findIndex(m => m.id === scene.id);
      currentMainIndex = idx >= 0 ? idx : currentMainIndex;
      const percent = total <= 1 ? 100 : Math.round((currentMainIndex) / (total - 1) * 100);

      // собираем разметку
      let html = `<div class="card" style="background-color:${game.theme.background}">
        ${scene.media && scene.media.url ? `<img src="${scene.media.url}" alt="" style="width:100%;max-height:300px;object-fit:cover;border-radius:8px">` : ""}
        <div class="overlay">
          <div class="top">
            <span>${escapeHtml(game.title)}</span>
            <span>${idx+1} / ${total}</span>
          </div>
          <div>
            <div class="label" style="color:${game.theme.accent}">${escapeHtml(scene.title)}</div>
            <h1>${escapeHtml(scene.task)}</h1>
            <div class="player-answers">
              ${scene.answers.map(a => `<button>${escapeHtml(a.icon)} ${escapeHtml(a.text)}</button>`).join('')}
            </div>
          </div>
        </div>
      </div>
      <div class="progress" style="position:relative;bottom:0">
        <div class="player-progress-row"><span>Progress</span><span>${percent}%</span></div>
        <div class="player-progress-track"><div class="player-progress-fill" style="width:${percent}%;"></div></div>
      </div>`;

      document.getElementById("app").innerHTML = html;
    }

    // По умолчанию покажем стартовую сцену
    const start = game.scenes.find(s => s.id === game.startSceneId) || game.scenes[0];
    renderScene(start);
  </script>
</body>
</html>
