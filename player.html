<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interactive game</title>
  <style>
    html, body { margin:0; min-height:100%; background:transparent; }
    #app { min-height:100vh; display:grid; place-items:center; padding:12px; }
    .card { width:100%; min-height:100vh; position:relative; overflow:hidden; border-radius:18px; background-size:cover; background-position:center; }
    .overlay { position:absolute; inset:0; padding:clamp(20px,5vw,48px); display:flex; flex-direction:column; justify-content:space-between; }
    .shade { background: linear-gradient(180deg, rgba(7,16,29,.08), rgba(7,16,29,.92) 84%); }
    .top { display:flex; justify-content:space-between; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .label { font-size:11px; font-weight:900; letter-spacing:.13em; text-transform:uppercase; }
    h1 { font-size: clamp(27px,5vw,54px); margin:10px 0 20px; }
    .answers { display:grid; gap:9px; }
    .answer { width:100%; padding:14px 18px; display:flex; align-items:center; gap:12px; border:1px solid #ffffff40; background:#111827cc; color:white; }
    .answer:hover { background: var(--accent); color:#101827; }
    .progress { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 40; }
    .progress-row { display:flex; justify-content:space-between; font-size:10px; font-weight:900; }
    .progress-track { height:8px; background: rgba(255,255,255,.2); border-radius:999px; overflow:hidden; }
    .progress-fill { height:100%; width:0%; background:var(--accent); transition: width .5s; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>

  <script>
    "use strict";

    function escapeHtml(v){ return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

    // decode data
    function decode(hash){
      const b = hash.replace(/-/g,'+').replace(/_/g,'/');
      const json = decodeURIComponent(escape(atob(b)));
      return JSON.parse(json);
    }

    const raw = location.hash.substring(1);
    if(!raw){
      document.getElementById('app').innerHTML = '<div class="message">Нет данных игры.</div>';
    } else {
      const game = decode(raw);
      const mains = (game.scenes||[]).filter(s => s.role !== 'support');
      let currentSceneId = game.startSceneId;
      const renderScene = (scene) => {
        const idx = mains.findIndex(m => m.id === scene.id);
        const displayIndex = idx >= 0 ? idx + 1 : 1;
        const total = mains.length || 1;
        const percent = (total <= 1) ? 100 : Math.round((idx>=0 ? idx : 0) / (total - 1) * 100);
        const img = (scene.media && scene.media.url) ? scene.media.url : '';
        const html =
          `<section class="card" style="background-color:${game.theme.background};${img?' background-image:url(\"'+img+'\")':''}">
            ${scene.media && scene.media.url && scene.media.type==='video' ? `<video class="video" src="${scene.media.url}" autoplay muted loop playsinline></video>`:''}
            <div class="overlay ${scene.media && scene.media.type==='image' ? 'shade' : ''}">
              <div class="top"><span>${escapeHtml(game.title)}</span><span>${displayIndex} / ${total}</span></div>
              <div><span class="label" style="color:${game.theme.accent}">${escapeHtml(scene.title)}</span><h1>${escapeHtml(scene.task)}</h1>
              <div class="answers">${scene.answers.map((a,i)=>`<button class="answer" data-i="${i}"><span>${escapeHtml(a.icon)}</span> ${escapeHtml(a.text)}</button>`).join('')}</div></div>
            </div>
          </section>`;
        document.getElementById('app').innerHTML = html;

        document.querySelectorAll('.answer').forEach(btn=>{
          btn.addEventListener('click', () => {
            const i = Number(btn.getAttribute('data-i'));
            const answer = scene.answers[i];
            if (answer && answer.nextSceneId){
              currentSceneId = answer.nextSceneId;
              const next = game.scenes.find(s => s.id === currentSceneId);
              if (next) renderScene(next);
            }
          });
        });

        // прогресс внизу
        const progHtml = `
          <div class="progress" aria-label="Progress" role="progressbar" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-row"><span>Progress</span><span>${percent}%</span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${percent}%;"></div></div>
          </div>
        `;
        const overlay = document.querySelector('.overlay');
        if (overlay) overlay.insertAdjacentHTML('beforeend', progHtml);
      };

      // стартовая сцена
      const start = game.scenes.find(s => s.id === currentSceneId) || game.scenes[0];
      renderScene(start);
    }
  </script>
</body>
</html>
