<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Interactive game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: transparent;
    }

    body {
      color: #fff;
      font-family: Arial, sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    #app {
      min-height: 100vh;
      padding: 12px;

      display: grid;
      place-items: center;
    }

    .card {
      position: relative;

      width: 100%;
      min-height: calc(100vh - 24px);

      overflow: hidden;
      border-radius: 18px;

      background-size: cover;
      background-position: center;
    }

    .video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;

      padding: clamp(20px, 5vw, 48px);

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card.has-progress .overlay {
      padding-bottom: 76px;
    }

    .shade {
      background:
        linear-gradient(
          180deg,
          rgba(7, 16, 29, 0.08),
          rgba(7, 16, 29, 0.92) 84%
        );
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 850px;
      margin: 12px 0 26px;

      font-size: clamp(30px, 6vw, 62px);
      line-height: 1.04;
    }

    p {
      max-width: 760px;

      font-size: clamp(15px, 2vw, 20px);
      line-height: 1.55;
    }

    .answers {
      display: grid;
      gap: 9px;
    }

    .answer {
      width: 100%;
      padding: 15px 18px;

      display: flex;
      align-items: center;
      gap: 12px;

      border: 1px solid
        rgba(255, 255, 255, 0.21);

      color: #fff;
      background:
        rgba(17, 24, 39, 0.77);

      text-align: left;
    }

    .answer:hover {
      color: #101827;
    }

    .transition {
      position: absolute;
      inset: 0;
      z-index: 10;

      background-size: cover;
      background-position: center;
    }

    .message {
      padding: 20px;
      text-align: center;
    }

    /*
      Адаптивный прогресс-бар.
    */

    .progress {
      position: absolute;

      left: clamp(20px, 5vw, 48px);
      right: clamp(20px, 5vw, 48px);
      bottom: 20px;

      z-index: 8;
    }

    .progress-row {
      margin-bottom: 7px;

      display: flex;
      justify-content: space-between;

      color: #f5f7ff;

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      text-shadow: 0 1px 5px #000;
    }

    .progress-track {
      height: 9px;
      overflow: hidden;

      border: 1px solid
        rgba(255, 255, 255, 0.25);

      border-radius: 999px;

      background:
        rgba(5, 9, 20, 0.55);

      backdrop-filter: blur(5px);
    }

    .progress-fill {
      height: 100%;

      border-radius: 999px;

      box-shadow:
        0 0 14px currentColor;

      transition: width 0.5s ease;
    }

    @media (max-width: 600px) {
      #app {
        padding: 0;
      }

      .card {
        min-height: 100vh;
        border-radius: 0;
      }

      .overlay {
        padding: 22px;
      }

      .card.has-progress .overlay {
        padding-bottom: 70px;
      }

      .progress {
        left: 22px;
        right: 22px;
        bottom: 17px;
      }

      .progress-track {
        height: 8px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="message">
      Loading…
    </div>
  </div>

  <script>
    "use strict";

    const app =
      document.querySelector("#app");

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        character => {
          const replacements = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          };

          return replacements[character];
        }
      );
    }

    function decodeProject(value) {
      let base64 = value
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      while (base64.length % 4) {
        base64 += "=";
      }

      const json = decodeURIComponent(
        escape(atob(base64))
      );

      return JSON.parse(json);
    }

    function directMediaUrl(
      value,
      mediaType = "image"
    ) {
      const originalUrl =
        String(value || "").trim();

      if (!originalUrl) {
        return "";
      }

      try {
        const url =
          new URL(originalUrl);

        if (
          url.hostname.includes(
            "drive.google.com"
          )
        ) {
          let fileId = "";

          const pathMatch =
            url.pathname.match(
              /\/file\/d\/([^/]+)/
            );

          if (pathMatch) {
            fileId = pathMatch[1];
          }

          if (!fileId) {
            fileId =
              url.searchParams.get("id") ||
              "";
          }

          if (fileId) {
            if (mediaType === "image") {
              return (
                "https://lh3.googleusercontent.com/d/" +
                encodeURIComponent(fileId)
              );
            }

            return (
              "https://drive.google.com/uc" +
              "?export=download&id=" +
              encodeURIComponent(fileId)
            );
          }
        }

        if (
          url.hostname.includes(
            "dropbox.com"
          )
        ) {
          url.searchParams.delete("dl");
          url.searchParams.set("raw", "1");

          return url.toString();
        }

        if (
          url.hostname === "1drv.ms" ||
          url.hostname.includes(
            "onedrive.live.com"
          )
        ) {
          const encodedShareUrl = btoa(
            unescape(
              encodeURIComponent(
                originalUrl
              )
            )
          )
            .replace(/\//g, "_")
            .replace(/\+/g, "-")
            .replace(/=+$/, "");

          return (
            "https://api.onedrive.com/v1.0" +
            "/shares/u!" +
            encodedShareUrl +
            "/root/content"
          );
        }

        return originalUrl;
      } catch (error) {
        return originalUrl;
      }
    }

    let game;

    try {
      game = decodeProject(
        location.hash.slice(1)
      );
    } catch (error) {
      console.error(error);

      app.innerHTML = `
        <div class="message">
          Game data could not be loaded.
        </div>
      `;

      throw error;
    }

    /*
      Для старых JSON-файлов,
      созданных до появления прогресс-бара.
    */

    game.theme.showProgress =
      game.theme.showProgress !== false;

    let currentSceneId =
      game.startSceneId;

    let visitedScenes =
      new Set([currentSceneId]);

    document.documentElement.lang =
      game.language || "ru";

    document.title =
      game.title || "Interactive game";

    document.body.style.fontFamily =
      game.theme.font;

    document.body.style.background =
      game.theme.transparent
        ? "transparent"
        : game.theme.background;

    function getButtonRadius() {
      if (game.theme.shape === "round") {
        return "999px";
      }

      if (
        game.theme.shape === "square"
      ) {
        return "3px";
      }

      return "12px";
    }

    function getCardBackground() {
      return game.theme.transparent
        ? "transparent"
        : game.theme.background;
    }

    /*
      Поиск кратчайшего пути
      от сцены до финала.
    */

    function getDistanceToFinish(
      startSceneId
    ) {
      const queue = [
        [startSceneId, 0]
      ];

      const checkedScenes = new Set();

      while (queue.length > 0) {
        const [
          sceneId,
          distance
        ] = queue.shift();

        if (
          checkedScenes.has(sceneId)
        ) {
          continue;
        }

        checkedScenes.add(sceneId);

        const scene =
          game.scenes.find(
            item => item.id === sceneId
          );

        if (!scene) {
          continue;
        }

        const hasFinishAnswer =
          scene.answers.some(
            answer =>
              answer.action === "finish" ||
              answer.nextSceneId ===
                "__finish__"
          );

        if (hasFinishAnswer) {
          return distance + 1;
        }

        scene.answers.forEach(answer => {
          if (
            answer.action !== "finish" &&
            answer.nextSceneId &&
            !checkedScenes.has(
              answer.nextSceneId
            )
          ) {
            queue.push([
              answer.nextSceneId,
              distance + 1
            ]);
          }
        });
      }

      return Math.max(
        1,
        game.scenes.length
      );
    }

    function calculateProgress(
      finished = false
    ) {
      if (finished) {
        return 100;
      }

      const completedSteps =
        Math.max(
          0,
          visitedScenes.size - 1
        );

      const remainingSteps =
        getDistanceToFinish(
          currentSceneId
        );

      if (completedSteps === 0) {
        return 0;
      }

      const progress = Math.round(
        completedSteps /
        (
          completedSteps +
          remainingSteps
        ) *
        100
      );

      return Math.max(
        5,
        Math.min(95, progress)
      );
    }

    function createProgressMarkup(
      finished = false
    ) {
      if (!game.theme.showProgress) {
        return "";
      }

      const progress =
        calculateProgress(finished);

      return `
        <div
          class="progress"
          role="progressbar"
          aria-label="Progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="${progress}"
        >
          <div class="progress-row">
            <span>Progress</span>
            <span>${progress}%</span>
          </div>

          <div class="progress-track">
            <div
              class="progress-fill"
              style="
                width:${progress}%;
                background:${game.theme.accent};
                color:${game.theme.accent};
              "
            ></div>
          </div>
        </div>
      `;
    }

    function renderScene() {
      const scene =
        game.scenes.find(
          item =>
            item.id === currentSceneId
        ) ||
        game.scenes[0];

      const sceneIndex =
        game.scenes.findIndex(
          item => item.id === scene.id
        );

      let backgroundImage = "";

      if (
        scene.media.type === "image" &&
        scene.media.url
      ) {
        backgroundImage =
          directMediaUrl(
            scene.media.url,
            "image"
          );
      } else if (
        !game.theme.transparent &&
        game.theme.backgroundImage
      ) {
        backgroundImage =
          directMediaUrl(
            game.theme.backgroundImage,
            "image"
          );
      }

      const hasSceneMedia = Boolean(
        (
          scene.media.type === "image" ||
          scene.media.type === "video"
        ) &&
        scene.media.url
      );

      const useShade =
        hasSceneMedia ||
        !game.theme.transparent;

      app.innerHTML = `
        <section
          class="
            card
            ${
              game.theme.showProgress
                ? "has-progress"
                : ""
            }
          "
          style="
            background-color:
              ${getCardBackground()};

            ${
              backgroundImage
                ? `background-image:
                    url('${escapeHtml(
                      backgroundImage
                    )}');`
                : ""
            }
          "
        >
          ${
            scene.media.type === "video" &&
            scene.media.url
              ? `
                <video
                  class="video"
                  src="${escapeHtml(
                    directMediaUrl(
                      scene.media.url,
                      "video"
                    )
                  )}"
                  autoplay
                  muted
                  loop
                  playsinline
                ></video>
              `
              : ""
          }

          <div
            class="overlay ${
              useShade ? "shade" : ""
            }"
          >
            <div class="top">
              <span>
                ${escapeHtml(game.title)}
              </span>

              <span>
                ${sceneIndex + 1}
                /
                ${game.scenes.length}
              </span>
            </div>

            <div>
              <span
                class="label"
                style="
                  color:${game.theme.accent}
                "
              >
                ${escapeHtml(scene.title)}
              </span>

              <h1>
                ${escapeHtml(scene.task)}
              </h1>

              <div class="answers">
                ${scene.answers
                  .map(
                    (
                      answer,
                      answerIndex
                    ) => `
                      <button
                        class="answer"
                        data-answer="${answerIndex}"
                        style="
                          border-radius:
                            ${getButtonRadius()}
                        "
                      >
                        <span>
                          ${escapeHtml(
                            answer.icon
                          )}
                        </span>

                        <span>
                          ${escapeHtml(
                            answer.text
                          )}
                        </span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
          </div>

          ${createProgressMarkup(false)}
        </section>
      `;

      document
        .querySelectorAll(
          "[data-answer]"
        )
        .forEach(button => {
          button.addEventListener(
            "click",
            () => {
              const answer =
                scene.answers[
                  Number(
                    button.dataset.answer
                  )
                ];

              playAnswer(answer);
            }
          );

          button.addEventListener(
            "mouseenter",
            () => {
              button.style.background =
                game.theme.accent;
            }
          );

          button.addEventListener(
            "mouseleave",
            () => {
              button.style.background =
                "rgba(17,24,39,.77)";
            }
          );
        });
    }

    function showFinalFeedback() {
      const feedback =
        game.feedback || {};

      const feedbackImage =
        directMediaUrl(
          feedback.image,
          "image"
        );

      const useShade =
        Boolean(feedbackImage) ||
        !game.theme.transparent;

      app.innerHTML = `
        <section
          class="
            card
            ${
              game.theme.showProgress
                ? "has-progress"
                : ""
            }
          "
          style="
            background-color:
              ${getCardBackground()};

            ${
              feedbackImage
                ? `background-image:
                    url('${escapeHtml(
                      feedbackImage
                    )}');`
                : ""
            }
          "
        >
          <div
            class="overlay ${
              useShade ? "shade" : ""
            }"
          >
            <div></div>

            <div>
              <span
                class="label"
                style="
                  color:${game.theme.accent}
                "
              >
                FINISH
              </span>

              <h1>
                ${escapeHtml(
                  feedback.title ||
                  "Great work!"
                )}
              </h1>

              <p>
                ${escapeHtml(
                  feedback.text ||
                  "You completed the game."
                )}
              </p>

              <button
                id="restartButton"
                class="answer"
                style="
                  border-radius:
                    ${getButtonRadius()}
                "
              >
                ${escapeHtml(
                  feedback.restartText ||
                  "Play again"
                )}
              </button>
            </div>
          </div>

          ${createProgressMarkup(true)}
        </section>
      `;

      const restartButton =
        document.querySelector(
          "#restartButton"
        );

      restartButton.addEventListener(
        "click",
        () => {
          currentSceneId =
            game.startSceneId;

          visitedScenes =
            new Set([currentSceneId]);

          renderScene();
        }
      );

      restartButton.addEventListener(
        "mouseenter",
        () => {
          restartButton.style.background =
            game.theme.accent;
        }
      );

      restartButton.addEventListener(
        "mouseleave",
        () => {
          restartButton.style.background =
            "rgba(17,24,39,.77)";
        }
      );
    }

    function openNextScene(answer) {
      if (
        answer.action === "finish" ||
        answer.nextSceneId === "__finish__"
      ) {
        showFinalFeedback();
        return;
      }

      currentSceneId =
        answer.nextSceneId ||
        game.startSceneId;

      /*
        Повторное посещение сцены
        не увеличивает прогресс.
      */

      visitedScenes.add(currentSceneId);

      renderScene();
    }

    function playAnswer(answer) {
      const media =
        answer.transition;

      if (
        !media ||
        media.type === "none" ||
        !media.url
      ) {
        openNextScene(answer);
        return;
      }

      const card =
        document.querySelector(".card");

      const layer =
        document.createElement("div");

      layer.className = "transition";

      layer.style.backgroundColor =
        getCardBackground();

      if (media.type === "image") {
        const imageUrl =
          directMediaUrl(
            media.url,
            "image"
          );

        layer.style.backgroundImage =
          `url("${imageUrl.replace(
            /"/g,
            "%22"
          )}")`;

        card.appendChild(layer);

        setTimeout(() => {
          openNextScene(answer);
        }, 1800);
      }

      if (media.type === "video") {
        const video =
          document.createElement("video");

        video.className = "video";

        video.src = directMediaUrl(
          media.url,
          "video"
        );

        video.autoplay = true;
        video.controls = true;
        video.playsInline = true;

        video.addEventListener(
          "ended",
          () => {
            openNextScene(answer);
          }
        );

        layer.appendChild(video);
        card.appendChild(layer);
      }
    }

    renderScene();
  </script>
</body>
</html>
